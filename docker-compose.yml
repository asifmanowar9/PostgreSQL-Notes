# version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pg_learning
    environment:
      POSTGRES_USER: asif
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: learning_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:

